<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>小景 · 景点知识助手</title>
<!-- 版本: v2.4 - 讲解互动TTS分离+图片代理+先答后问 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; height: 100vh; display: flex; }
  .sidebar { width: 260px; background: #202123; color: #ececf1; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.2s; }
  .sidebar-header { padding: 12px; border-bottom: 1px solid #353740; }
  .new-chat-btn { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; text-align: center; }
  .new-chat-btn:hover { background: #1557b0; }
  .conv-list { flex: 1; overflow-y: auto; padding: 8px; }
  .conv-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #c5c5d2; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .conv-item:hover { background: #2a2b32; }
  .conv-item.active { background: #343541; color: white; }
  .conv-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item .del-btn { display: none; background: none; border: none; color: #999; cursor: pointer; font-size: 14px; padding: 0 4px; }
  .conv-item:hover .del-btn { display: inline; }
  .conv-item .del-btn:hover { color: #f44336; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header { background: #1a73e8; color: white; padding: 12px 20px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header .menu-btn { display: none; background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .header span { font-size: 12px; font-weight: 400; opacity: 0.8; }
  .chat-area { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 16px; display: flex; gap: 10px; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .msg.assistant .avatar { background: #e3f2fd; }
  .msg.user .avatar { background: #f5f5f5; }
  .bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .msg.assistant .bubble { background: white; border: 1px solid #e0e0e0; }
  .msg.user .bubble { background: #1a73e8; color: white; }
  .input-area { background: white; border-top: 1px solid #e0e0e0; padding: 14px; }
  .input-wrap { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
  .input-wrap input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; }
  .input-wrap input:focus { border-color: #1a73e8; }
  .input-wrap button { padding: 8px 20px; background: #1a73e8; color: white; border: none; border-radius: 24px; font-size: 14px; cursor: pointer; }
  .input-wrap button:hover { background: #1557b0; }
  .input-wrap button:disabled { background: #ccc; cursor: not-allowed; }
  .stop-btn { display: none; padding: 8px 16px; background: #ef5350; color: white; border: none; border-radius: 24px; font-size: 14px; cursor: pointer; }
  .stop-btn:hover { background: #d32f2f; }
  .stop-btn.show { display: inline-block; }
  .welcome { text-align: center; padding: 50px 20px; color: #666; }
  .welcome h2 { font-size: 20px; margin-bottom: 8px; color: #333; }
  .welcome p { font-size: 13px; margin-bottom: 16px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .suggestions button { padding: 6px 14px; background: white; border: 1px solid #ddd; border-radius: 16px; font-size: 12px; cursor: pointer; color: #333; }
  .suggestions button:hover { border-color: #1a73e8; color: #1a73e8; }
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .header .menu-btn { display: block; }
  }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
  .overlay.show { display: block; }
  /* 听讲解按钮 */
  .guide-btn { display: inline-block; margin-top: 6px; padding: 3px 10px; font-size: 12px; background: #e8f0fe; color: #1a73e8; border: 1px solid #d2e3fc; border-radius: 12px; cursor: pointer; }
  .guide-btn:hover { background: #d2e3fc; }
  .guide-btn.loading { opacity: 0.6; pointer-events: none; }
  /* 讲解面板 */
  .guide-panel { position: fixed; top: 0; right: -420px; width: 400px; height: 100vh; background: white; box-shadow: -2px 0 12px rgba(0,0,0,0.15); z-index: 200; transition: right 0.3s ease; display: flex; flex-direction: column; }
  .guide-panel.open { right: 0; }
  .guide-panel-header { padding: 16px 20px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; }
  .guide-panel-header h3 { font-size: 16px; color: #1a73e8; margin: 0; }
  .guide-panel-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #666; padding: 0 4px; }
  .guide-panel-close:hover { color: #333; }
  .guide-panel-body { flex: 1; overflow-y: auto; padding: 20px; }
  .guide-spot-name { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 4px; }
  .guide-spot-city { font-size: 13px; color: #888; margin-bottom: 16px; }
  .guide-content { font-size: 15px; line-height: 1.8; color: #333; white-space: pre-wrap; }
  .guide-panel-footer { padding: 12px 20px; border-top: 1px solid #e0e0e0; text-align: center; }
  .guide-panel-footer .guide-list-btn { padding: 6px 16px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 16px; font-size: 13px; cursor: pointer; color: #555; }
  .guide-panel-footer .guide-list-btn:hover { border-color: #1a73e8; color: #1a73e8; }
  .guide-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 199; }
  .guide-overlay.show { display: block; }
  /* TTS语音播放控件 */
  .tts-bar { padding: 10px 16px; border-bottom: 1px solid #e0e0e0; background: #f8f9fa; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tts-play-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: #1a73e8; color: white; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
  .tts-play-btn:hover { background: #1557b0; }
  .tts-play-btn.playing { background: #ef5350; }
  .tts-play-btn.playing:hover { background: #d32f2f; }
  .tts-voice-select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; cursor: pointer; background: white; color: #333; }
  .tts-progress-wrap { flex: 1; min-width: 100px; display: flex; align-items: center; gap: 6px; }
  .tts-progress { flex: 1; height: 4px; background: #e0e0e0; border-radius: 2px; cursor: pointer; position: relative; }
  .tts-progress-fill { height: 100%; background: #1a73e8; border-radius: 2px; width: 0%; transition: width 0.2s; }
  .tts-time { font-size: 11px; color: #999; white-space: nowrap; }
  /* 讲解风格选择栏 */
  .style-bar { padding: 8px 16px; border-bottom: 1px solid #e0e0e0; background: #fff; display: flex; align-items: center; gap: 8px; }
  .style-bar label { font-size: 12px; color: #666; white-space: nowrap; }
  .style-select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; cursor: pointer; background: white; color: #333; }
  .regen-btn { padding: 4px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; cursor: pointer; background: #f5f5f5; color: #555; display: flex; align-items: center; gap: 4px; }
  .regen-btn:hover { border-color: #1a73e8; color: #1a73e8; }
  .regen-btn.loading { opacity: 0.6; pointer-events: none; }
  /* 讲解互动对话区 */
  .guide-chat-area { padding: 12px 16px; }
  .guide-chat-msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.6; max-width: 85%; word-wrap: break-word; }
  .guide-chat-msg.user { background: #1a73e8; color: white; margin-left: auto; }
  .guide-chat-msg.assistant { background: #f0f2f5; color: #333; }
  .guide-chat-msg.loading { color: #999; font-style: italic; }
  .guide-chat-title { font-size: 12px; color: #999; margin: 8px 0 6px; text-align: center; }
  /* 互动消息播放按钮 */
  .guide-chat-msg.assistant { display: flex; align-items: flex-start; gap: 6px; }
  .guide-chat-msg.assistant .msg-text { flex: 1; }
  .tts-msg-btn { flex-shrink: 0; width: 26px; height: 26px; border: none; background: rgba(0,0,0,0.05); cursor: pointer; font-size: 13px; opacity: 0.5; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .tts-msg-btn:hover { opacity: 1; background: #d2e3fc; }
  .tts-msg-btn.playing { opacity: 1; background: #1a73e8; color: white; animation: ttsPulse 1s infinite; }
  @keyframes ttsPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  /* 讲解输入栏 */
  .guide-input-bar { padding: 10px 16px; border-top: 1px solid #e0e0e0; background: #fff; display: flex; gap: 8px; align-items: center; }
  .guide-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 8px 14px; font-size: 13px; outline: none; resize: none; max-height: 60px; }
  .guide-input:focus { border-color: #1a73e8; }
  .guide-send-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: #1a73e8; color: white; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .guide-send-btn:hover { background: #1557b0; }
  .guide-send-btn:disabled { background: #ccc; cursor: not-allowed; }
  .guide-mic-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ddd; background: white; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .guide-mic-btn:hover { border-color: #1a73e8; }
  .guide-mic-btn.recording { background: #ef5350; border-color: #ef5350; color: white; animation: micPulse 1.2s infinite; }
  @keyframes micPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  @media (max-width: 768px) {
    .guide-panel { width: 100%; right: -100%; }
  }
  /* 图片展示 */
  .img-gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .img-thumb { width: 120px; height: 90px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #e0e0e0; transition: transform 0.15s; }
  .img-thumb:hover { transform: scale(1.05); border-color: #1a73e8; }
  /* 可信度徽章样式 */
  .credibility-tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; margin-top: 8px; }
  .credibility-green { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .credibility-yellow { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
  .credibility-red { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  .credibility-gray { background: #f5f5f5; color: #757575; border: 1px solid #e0e0e0; }
  .img-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; justify-content: center; align-items: center; }
  .img-overlay.show { display: flex; }
  .img-overlay img { max-width: 90vw; max-height: 85vh; border-radius: 8px; }
  .img-overlay .close-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; background: none; border: none; }

</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="new-chat-btn" onclick="newConversation()">+ 开启新对话</button>
  </div>
  <div class="conv-list" id="convList"></div>
</div>
<div class="main">
  <div class="header">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    小景 · 景点知识助手 <span>v0.2</span>
    <span id="uidBadge" style="font-size:11px;color:#999;margin-left:auto;">访客 ----</span>
  </div>
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcomeArea">
      <h2>你好，我是小景</h2>
      <p>基于大模型+知识图谱的景点智能助手，问我任何景点问题吧</p>
      <div class="suggestions">
        <button onclick="showGuideList();document.getElementById('guidePanel').classList.add('open');document.getElementById('guideOverlay').classList.add('show')">景点讲解</button>
      </div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="inputBox" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')send()" />
      <button id="sendBtn" onclick="send()">发送</button>
      <button id="stopBtn" class="stop-btn" onclick="stopGeneration()">停止</button>
    </div>
  </div>
</div>
<div class="guide-overlay" id="guideOverlay" onclick="closeGuidePanel()"></div>
<div class="img-overlay" id="imgOverlay" onclick="closeImgOverlay()">
  <button class="close-btn" onclick="closeImgOverlay()">&times;</button>
  <img id="imgOverlayImg" src="" alt="" />
</div>
<div class="guide-panel" id="guidePanel">
  <div class="guide-panel-header">
    <h3>景点讲解</h3>
    <button class="guide-panel-close" onclick="closeGuidePanel()">&times;</button>
  </div>
  <div class="tts-bar" id="ttsBar" style="display:none">
    <button class="tts-play-btn" id="ttsPlayBtn" onclick="toggleTTS()">▶</button>
    <select class="tts-voice-select" id="ttsVoiceSelect" onchange="changeTTSVoice()">
      <option value="female">女声</option>
      <option value="male">男声</option>
    </select>
    <div class="tts-progress-wrap">
      <div class="tts-progress" id="ttsProgress" onclick="seekTTS(event)">
        <div class="tts-progress-fill" id="ttsProgressFill"></div>
      </div>
      <span class="tts-time" id="ttsTime">0:00</span>
    </div>
  </div>
  <div class="style-bar" id="styleBar" style="display:none">
    <label>风格：</label>
    <select class="style-select" id="styleSelect" onchange="regenerateGuide()">
      <option value="vivid">活泼生动</option>
      <option value="formal">专业正式</option>
      <option value="humor">幽默风趣</option>
      <option value="poetic">诗意文雅</option>
      <option value="simple">简洁明了</option>
    </select>
    <button class="regen-btn" id="regenBtn" onclick="regenerateGuide()">↻ 换一种</button>
  </div>
  <div class="guide-panel-body" id="guidePanelBody">
    <div id="guideContent"></div>
    <div class="guide-chat-area" id="guideChatArea" style="display:none">
      <div class="guide-chat-title">— 想了解更多？向讲解员提问吧 —</div>
      <div id="guideChatMessages"></div>
    </div>
  </div>
  <div class="guide-input-bar" id="guideInputBar" style="display:none">
    <button class="guide-mic-btn" id="guideMicBtn" onclick="toggleGuideMic()" title="语音输入">🎤</button>
    <input class="guide-input" id="guideInput" placeholder="向讲解员提问..." onkeydown="if(event.key==='Enter')sendGuideChat()" />
    <button class="guide-send-btn" id="guideSendBtn" onclick="sendGuideChat()">➤</button>
  </div>
  <div class="guide-panel-footer">
    <button class="guide-list-btn" onclick="showGuideList()">查看所有可讲解景点</button>
  </div>
</div>
<script>
const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const convList = document.getElementById('convList');
const welcomeArea = document.getElementById('welcomeArea');

const _key = new URLSearchParams(window.location.search).get('key') || '';
const _keyQ = _key ? '?key=' + encodeURIComponent(_key) : '';
const _keyA = _key ? '&key=' + encodeURIComponent(_key) : '';

// 每个访客独立ID，存在localStorage，保证对话隔离
if (!localStorage.getItem('_uid')) localStorage.setItem('_uid', 'u_' + Math.random().toString(36).substr(2, 8));
const _uid = localStorage.getItem('_uid');

// 显示访客ID后4位，方便验证隔离
document.getElementById('uidBadge').textContent = '访客 ' + _uid.slice(-4);

// 记录上次访问的对话ID，用于判断是否需要新建对话
const _lastVisitKey = '_lastVisit_' + _uid;

let currentConvId = null;
let convs = [];
let knownSpots = [];  // 从/guide接口获取的景点列表
var currentAbortCtrl = null;  // 当前请求的AbortController，用于停止生成

// 加载可讲解景点列表
async function loadKnownSpots() {
  try {
    const r = await fetch('/guide' + _keyQ);
    if (r.ok) {
      const d = await r.json();
      knownSpots = d.spots || [];
    }
  } catch(e) {}
}
loadKnownSpots();

// 从文本中检测景点名
function detectSpots(text) {
  if (!knownSpots.length) return [];
  var found = [];
  for (var i = 0; i < knownSpots.length; i++) {
    var name = knownSpots[i].name;
    if (text.indexOf(name) !== -1) {
      found.push(knownSpots[i]);
    }
  }
  return found;
}

// 打开讲解面板
var _currentGuideSpot = '';  // 当前讲解的景点名，用于重新生成
function openGuidePanel(spotName) {
  _currentGuideSpot = spotName;
  var panel = document.getElementById('guidePanel');
  var overlay = document.getElementById('guideOverlay');
  // 只更新guideContent，不覆盖整个body（保留guideChatArea等子元素结构）
  var contentDiv = document.getElementById('guideContent');
  if (contentDiv) {
    contentDiv.innerHTML = '<div style="text-align:center;color:#999;padding:40px">加载中...</div>';
  }
  panel.classList.add('open');
  overlay.classList.add('show');
  // 重置TTS状态
  stopTTS();
  document.getElementById('ttsBar').style.display = 'none';
  document.getElementById('styleBar').style.display = 'none';
  document.getElementById('guideInputBar').style.display = 'none';
  document.getElementById('guideChatArea').style.display = 'none';
  // 重置风格选择为默认
  document.getElementById('styleSelect').value = 'vivid';

  fetchGuideContent(spotName, 'vivid');
}

// 拉取讲解内容（支持风格参数）
function fetchGuideContent(spotName, style) {
  console.log('[Guide] fetchGuideContent:', spotName, style);
  var body = document.getElementById('guidePanelBody');
  var regenBtn = document.getElementById('regenBtn');
  if (regenBtn) regenBtn.classList.add('loading');

  // 只更新guideContent，不覆盖整个body（避免删除guideChatArea等子元素）
  var contentDiv = document.getElementById('guideContent');
  if (contentDiv) {
    contentDiv.innerHTML = '<div style="text-align:center;color:#999;padding:40px">加载中...</div>';
  }
  stopTTS();

  var url = '/guide/' + encodeURIComponent(spotName) + _keyQ + (_keyQ ? '&' : '?') + 'style=' + style;
  console.log('[Guide] fetch URL:', url);
  fetch(url)
    .then(function(r) {
      console.log('[Guide] response status:', r.status);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d) {
      console.log('[Guide] data received:', d.spot_name, d.style);
      if (regenBtn) regenBtn.classList.remove('loading');
      if (d.error) {
        if (contentDiv) contentDiv.innerHTML = '<div style="color:#f44336;padding:20px">' + escHtml(d.error) + '</div>';
        return;
      }
      // 只更新guideContent，保留guideChatArea等兄弟元素
      if (contentDiv) {
        contentDiv.innerHTML = '<div class="guide-spot-name">' + escHtml(d.spot_name) + '</div>'
          + (d.city ? '<div class="guide-spot-city">' + escHtml(d.city) + '</div>' : '')
          + '<div class="guide-content">' + escHtml(d.guide) + '</div>';
      }
      // 显示TTS控件和风格选择栏
      if (d.guide && 'speechSynthesis' in window) {
        document.getElementById('ttsBar').style.display = 'flex';
        _ttsText = d.guide;
        _ttsChunks = splitTTSChunks(d.guide);
        _ttsCharIndex = 0;
        updateTTSProgress();
      }
      document.getElementById('styleBar').style.display = 'flex';
      // 同步风格下拉框（如果后端返回了实际使用的style）
      if (d.style) document.getElementById('styleSelect').value = d.style;
      // 显示互动输入栏（讲解加载成功后才能提问）
      document.getElementById('guideInputBar').style.display = 'flex';
      // 清空旧的对话历史（用null检查避免子元素被覆盖后报错）
      _guideChatHistory = [];
      var chatMsgs = document.getElementById('guideChatMessages');
      if (chatMsgs) chatMsgs.innerHTML = '';
      var chatArea = document.getElementById('guideChatArea');
      if (chatArea) chatArea.style.display = 'none';
    })
    .catch(function(e) {
      console.error('[Guide] fetch error:', e);
      if (regenBtn) regenBtn.classList.remove('loading');
      if (contentDiv) contentDiv.innerHTML = '<div style="color:#f44336;padding:20px">加载失败: ' + escHtml(e.message) + '</div>';
    });
}

// 重新生成讲解（用当前选中的风格）
function regenerateGuide() {
  if (!_currentGuideSpot) return;
  var style = document.getElementById('styleSelect').value;
  // 清空对话历史
  _guideChatHistory = [];
  fetchGuideContent(_currentGuideSpot, style);
}

// ── 讲解互动对话 ──
var _guideChatHistory = [];  // 讲解对话历史 [{role, content}]
var _guideChatSending = false;
var _interactionTTSActive = false;  // 互动回答TTS是否正在播放
var _interactionTTSChunks = [];     // 互动回答的文本块
var _interactionTTSIdx = 0;         // 互动回答当前播放块索引
var _interactionTTSBtn = null;      // 当前正在播放的按钮元素

function sendGuideChat() {
  if (_guideChatSending || !_currentGuideSpot) return;
  var input = document.getElementById('guideInput');
  var q = input.value.trim();
  if (!q) return;

  // 自动暂停讲解TTS（保存位置，用户可点播放键从中断处继续）
  if (_ttsPlaying) {
    speechSynthesis.cancel();
    _ttsPlaying = false;
    document.getElementById('ttsPlayBtn').textContent = '▶';
    document.getElementById('ttsPlayBtn').classList.remove('playing');
    // _ttsCharIndex 保持不变，点播放键可从断点继续
  }
  // 停止正在播放的互动TTS
  _interactionTTSActive = false;
  if (_interactionTTSBtn) {
    _interactionTTSBtn.classList.remove('playing');
    _interactionTTSBtn.innerHTML = '🔊';
    _interactionTTSBtn = null;
  }

  // 显示对话区
  document.getElementById('guideChatArea').style.display = 'block';
  document.getElementById('guideInputBar').style.display = 'flex';

  // 追加用户消息
  appendGuideChatMsg('user', q);
  _guideChatHistory.push({role: 'user', content: q});
  input.value = '';

  // 显示加载中
  var loadingEl = appendGuideChatMsg('assistant', '思考中...', true);
  _guideChatSending = true;
  document.getElementById('guideSendBtn').disabled = true;

  // 调用后端
  var style = document.getElementById('styleSelect').value;
  fetch('/guide/' + encodeURIComponent(_currentGuideSpot) + '/chat' + _keyQ, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q, history: _guideChatHistory.slice(0, -1), style: style})
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      loadingEl.remove();
      if (d.error) {
        appendGuideChatMsg('assistant', '抱歉：' + d.error);
      } else {
        appendGuideChatMsg('assistant', d.answer);
        _guideChatHistory.push({role: 'assistant', content: d.answer});
        // 自动播放回答语音
        playInteractionTTS(d.answer, null);
      }
    })
    .catch(function(e) {
      loadingEl.remove();
      appendGuideChatMsg('assistant', '网络错误：' + e.message);
    })
    .finally(function() {
      _guideChatSending = false;
      document.getElementById('guideSendBtn').disabled = false;
    });
}

// 播放互动回答TTS（独立于主讲解TTS，不影响_ttsCharIndex）
function playInteractionTTS(text, btn) {
  // 停止主讲解TTS
  if (_ttsPlaying) {
    speechSynthesis.cancel();
    _ttsPlaying = false;
    document.getElementById('ttsPlayBtn').textContent = '▶';
    document.getElementById('ttsPlayBtn').classList.remove('playing');
  }
  // 停止上一个互动TTS
  _interactionTTSActive = false;
  if (_interactionTTSBtn) {
    _interactionTTSBtn.classList.remove('playing');
    _interactionTTSBtn.innerHTML = '🔊';
  }
  speechSynthesis.cancel();

  _interactionTTSActive = true;
  _interactionTTSChunks = splitTTSChunks(text);
  _interactionTTSIdx = 0;
  _interactionTTSBtn = btn;

  if (btn) {
    btn.classList.add('playing');
    btn.innerHTML = '⏸';
  }

  speakInteractionNext();
}

function speakInteractionNext() {
  if (!_interactionTTSActive || _interactionTTSIdx >= _interactionTTSChunks.length) {
    _interactionTTSActive = false;
    if (_interactionTTSBtn) {
      _interactionTTSBtn.classList.remove('playing');
      _interactionTTSBtn.innerHTML = '🔊';
      _interactionTTSBtn = null;
    }
    return;
  }

  var chunk = _interactionTTSChunks[_interactionTTSIdx];
  var utter = new SpeechSynthesisUtterance(chunk);
  utter.lang = 'zh-CN';
  utter.rate = 1.0;
  var voiceType = document.getElementById('ttsVoiceSelect').value;
  var voice = (voiceType === 'male' && _ttsMaleVoice) ? _ttsMaleVoice : _ttsFemaleVoice;
  if (voice) utter.voice = voice;

  utter.onend = function() {
    _interactionTTSIdx++;
    if (_interactionTTSActive) speakInteractionNext();
  };
  utter.onerror = function() {
    _interactionTTSIdx++;
    if (_interactionTTSActive) speakInteractionNext();
  };

  speechSynthesis.speak(utter);
}

function appendGuideChatMsg(role, text, isLoading) {
  var container = document.getElementById('guideChatMessages');
  var div = document.createElement('div');
  div.className = 'guide-chat-msg ' + role + (isLoading ? ' loading' : '');

  if (role === 'assistant' && !isLoading) {
    // 助手消息：文本 + 播放按钮
    var textSpan = document.createElement('span');
    textSpan.className = 'msg-text';
    textSpan.textContent = text;

    var ttsBtn = document.createElement('button');
    ttsBtn.className = 'tts-msg-btn';
    ttsBtn.innerHTML = '🔊';
    ttsBtn.title = '播放语音';
    ttsBtn.onclick = function() {
      if (_interactionTTSActive && _interactionTTSBtn === ttsBtn) {
        // 正在播放这条消息，点击暂停
        _interactionTTSActive = false;
        speechSynthesis.cancel();
        ttsBtn.classList.remove('playing');
        ttsBtn.innerHTML = '🔊';
        _interactionTTSBtn = null;
      } else {
        playInteractionTTS(text, ttsBtn);
      }
    };

    div.appendChild(textSpan);
    div.appendChild(ttsBtn);
  } else {
    div.textContent = text;
  }

  container.appendChild(div);
  // 滚动到底部
  var body = document.getElementById('guidePanelBody');
  body.scrollTop = body.scrollHeight;
  return div;
}

// ── 语音识别（讲解输入） ──
var _guideRecognition = null;
var _guideRecording = false;

function initGuideRecognition() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return false;
  _guideRecognition = new SR();
  _guideRecognition.lang = 'zh-CN';
  _guideRecognition.continuous = false;
  _guideRecognition.interimResults = true;

  _guideRecognition.onresult = function(event) {
    var final = '';
    var interim = '';
    for (var i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        final += event.results[i][0].transcript;
      } else {
        interim += event.results[i][0].transcript;
      }
    }
    var input = document.getElementById('guideInput');
    input.value = final || interim;
  };

  _guideRecognition.onend = function() {
    _guideRecording = false;
    document.getElementById('guideMicBtn').classList.remove('recording');
    document.getElementById('guideMicBtn').textContent = '🎤';
    // 如果有识别结果，自动发送
    var input = document.getElementById('guideInput');
    if (input.value.trim()) {
      sendGuideChat();
    }
  };

  _guideRecognition.onerror = function(event) {
    _guideRecording = false;
    document.getElementById('guideMicBtn').classList.remove('recording');
    document.getElementById('guideMicBtn').textContent = '🎤';
    if (event.error !== 'no-speech') {
      appendGuideChatMsg('user', '（语音识别失败：' + event.error + '）');
    }
  };
  return true;
}

function toggleGuideMic() {
  // 检查浏览器支持
  if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
    alert('当前浏览器不支持语音识别，请使用Chrome浏览器');
    return;
  }
  if (!_guideRecognition) {
    if (!initGuideRecognition()) {
      alert('语音识别初始化失败');
      return;
    }
  }

  if (_guideRecording) {
    _guideRecognition.stop();
  } else {
    // 停止TTS避免麦克风收音冲突
    if (_ttsPlaying) stopTTS();
    try {
      _guideRecognition.start();
      _guideRecording = true;
      document.getElementById('guideMicBtn').classList.add('recording');
      document.getElementById('guideMicBtn').textContent = '⏹';
    } catch (e) {
      alert('启动录音失败：' + e.message);
    }
  }
}

// ── TTS语音播放（基于浏览器Web Speech API） ──
var _ttsText = '';          // 当前讲解全文
var _ttsChunks = [];        // 分句后的文本块（SpeechSynthesis对长文本不稳定，需分块）
var _ttsCharIndex = 0;      // 当前播放到的字符位置
var _ttsPlaying = false;    // 是否正在播放
var _ttsVoices = [];        // 可用语音列表
var _ttsFemaleVoice = null; // 女声
var _ttsMaleVoice = null;   // 男声

// 加载语音列表（异步，浏览器可能延迟返回）
function loadTTSVoices() {
  if (!('speechSynthesis' in window)) return;
  _ttsVoices = speechSynthesis.getVoices();
  // 优先找中文女声/男声
  for (var i = 0; i < _ttsVoices.length; i++) {
    var v = _ttsVoices[i];
    if (v.lang.indexOf('zh') === 0 || v.lang.indexOf('cmn') === 0) {
      var name = v.name.toLowerCase();
      if (!_ttsFemaleVoice && (name.indexOf('female') >= 0 || name.indexOf('女') >= 0 || name.indexOf('xia') >= 0 || name.indexOf('ting') >= 0)) {
        _ttsFemaleVoice = v;
      }
      if (!_ttsMaleVoice && (name.indexOf('male') >= 0 || name.indexOf('男') >= 0 || name.indexOf('yun') >= 0 || name.indexOf('kang') >= 0)) {
        _ttsMaleVoice = v;
      }
    }
  }
  // 如果没找到明确标注的男女声，用前两个中文语音
  var zhVoices = _ttsVoices.filter(function(v) { return v.lang.indexOf('zh') === 0; });
  if (!_ttsFemaleVoice && zhVoices.length > 0) _ttsFemaleVoice = zhVoices[0];
  if (!_ttsMaleVoice && zhVoices.length > 1) _ttsMaleVoice = zhVoices[1];
}
if ('speechSynthesis' in window) {
  loadTTSVoices();
  speechSynthesis.onvoiceschanged = loadTTSVoices;
}

// 分句（按句号、问号、感叹号、换行分割，每块不超过200字）
function splitTTSChunks(text) {
  var chunks = [];
  var sentences = text.split(/([。！？\n]+)/);
  var current = '';
  for (var i = 0; i < sentences.length; i++) {
    current += sentences[i];
    if (/[。！？\n]/.test(sentences[i]) || current.length >= 200) {
      if (current.trim()) chunks.push(current.trim());
      current = '';
    }
  }
  if (current.trim()) chunks.push(current.trim());
  return chunks;
}

// 播放/暂停切换
function toggleTTS() {
  if (!_ttsText) return;
  // 停止互动TTS（顶部播放键只管主讲解内容）
  if (_interactionTTSActive) {
    _interactionTTSActive = false;
    speechSynthesis.cancel();
    if (_interactionTTSBtn) {
      _interactionTTSBtn.classList.remove('playing');
      _interactionTTSBtn.innerHTML = '🔊';
      _interactionTTSBtn = null;
    }
  }
  if (_ttsPlaying) {
    speechSynthesis.pause();
    _ttsPlaying = false;
    document.getElementById('ttsPlayBtn').textContent = '▶';
    document.getElementById('ttsPlayBtn').classList.remove('playing');
  } else {
    if (speechSynthesis.paused) {
      // 恢复暂停
      speechSynthesis.resume();
    } else if (speechSynthesis.speaking) {
      // 正在说话但状态异常，重新开始
      speechSynthesis.cancel();
      _ttsCharIndex = 0;
      speakNextChunk();
    } else {
      // 全新开始或从断点继续（用户提问时被中断后恢复）
      speakNextChunk();
    }
    _ttsPlaying = true;
    document.getElementById('ttsPlayBtn').textContent = '⏸';
    document.getElementById('ttsPlayBtn').classList.add('playing');
  }
}

// 播放下一个文本块
function speakNextChunk() {
  if (_ttsCharIndex >= _ttsChunks.length) {
    // 播放完毕
    _ttsPlaying = false;
    _ttsCharIndex = 0;
    document.getElementById('ttsPlayBtn').textContent = '▶';
    document.getElementById('ttsPlayBtn').classList.remove('playing');
    updateTTSProgress();
    return;
  }

  var chunk = _ttsChunks[_ttsCharIndex];
  var utter = new SpeechSynthesisUtterance(chunk);
  utter.lang = 'zh-CN';
  utter.rate = 1.0;

  // 选择语音
  var voiceType = document.getElementById('ttsVoiceSelect').value;
  var voice = (voiceType === 'male' && _ttsMaleVoice) ? _ttsMaleVoice : _ttsFemaleVoice;
  if (voice) utter.voice = voice;

  utter.onend = function() {
    _ttsCharIndex++;
    updateTTSProgress();
    if (_ttsPlaying) speakNextChunk();
  };
  utter.onerror = function() {
    _ttsCharIndex++;
    if (_ttsPlaying) speakNextChunk();
  };

  speechSynthesis.speak(utter);
  updateTTSProgress();
}

// 停止播放
function stopTTS() {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
  }
  _ttsPlaying = false;
  _ttsCharIndex = 0;
  // 也停止互动TTS
  _interactionTTSActive = false;
  if (_interactionTTSBtn) {
    _interactionTTSBtn.classList.remove('playing');
    _interactionTTSBtn.innerHTML = '🔊';
    _interactionTTSBtn = null;
  }
  var btn = document.getElementById('ttsPlayBtn');
  if (btn) {
    btn.textContent = '▶';
    btn.classList.remove('playing');
  }
  updateTTSProgress();
}

// 更新进度条
function updateTTSProgress() {
  var fill = document.getElementById('ttsProgressFill');
  var timeEl = document.getElementById('ttsTime');
  if (!fill || !timeEl) return;
  var total = _ttsChunks.length || 1;
  var pct = (_ttsCharIndex / total) * 100;
  fill.style.width = pct + '%';
  // 估算时间（按平均每字0.15秒）
  var playedChars = 0;
  for (var i = 0; i < _ttsCharIndex && i < _ttsChunks.length; i++) {
    playedChars += _ttsChunks[i].length;
  }
  var totalChars = _ttsText.length || 1;
  var playedSec = Math.round((playedChars / totalChars) * (totalChars * 0.15));
  var totalSec = Math.round(totalChars * 0.15);
  timeEl.textContent = formatTime(playedSec) + ' / ' + formatTime(totalSec);
}

function formatTime(sec) {
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// 进度条点击跳转
function seekTTS(event) {
  if (!_ttsChunks.length) return;
  var bar = document.getElementById('ttsProgress');
  var rect = bar.getBoundingClientRect();
  var pct = (event.clientX - rect.left) / rect.width;
  pct = Math.max(0, Math.min(1, pct));
  _ttsCharIndex = Math.floor(pct * _ttsChunks.length);
  if (_ttsPlaying) {
    speechSynthesis.cancel();
    speakNextChunk();
  } else {
    updateTTSProgress();
  }
}

// 切换男女声
function changeTTSVoice() {
  // 如果正在播放，重新开始当前句
  if (_ttsPlaying && speechSynthesis.speaking) {
    speechSynthesis.cancel();
    speakNextChunk();
  }
}

function closeGuidePanel() {
  document.getElementById('guidePanel').classList.remove('open');
  document.getElementById('guideOverlay').classList.remove('show');
  stopTTS();
  document.getElementById('ttsBar').style.display = 'none';
  document.getElementById('styleBar').style.display = 'none';
  document.getElementById('guideInputBar').style.display = 'none';
  document.getElementById('guideChatArea').style.display = 'none';
  // 停止录音
  if (_guideRecording && _guideRecognition) _guideRecognition.stop();
}

function showGuideList() {
  var body = document.getElementById('guidePanelBody');
  // 隐藏TTS栏、风格栏、对话区、输入栏（列表页不需要）
  stopTTS();
  document.getElementById('ttsBar').style.display = 'none';
  document.getElementById('styleBar').style.display = 'none';
  document.getElementById('guideInputBar').style.display = 'none';
  document.getElementById('guideChatArea').style.display = 'none';
  if (_guideRecording && _guideRecognition) _guideRecognition.stop();
  if (!knownSpots.length) {
    body.innerHTML = '<div style="color:#999;padding:20px">暂无可讲解景点</div>';
    return;
  }
  var html = '<div style="font-size:15px;font-weight:600;margin-bottom:12px;color:#333">可讲解景点 (' + knownSpots.length + ')</div>';
  for (var i = 0; i < knownSpots.length; i++) {
    var s = knownSpots[i];
    // 用data-index存储索引，通过事件委托处理点击，避免onclick转义问题
    html += '<div class="guide-spot-item" data-index="' + i + '" style="padding:8px 0;border-bottom:1px solid #f0f0f0;cursor:pointer">'
      + '<span style="font-size:14px;color:#1a73e8">' + escHtml(s.name) + '</span>'
      + (s.city ? '<span style="font-size:12px;color:#999;margin-left:8px">' + escHtml(s.city) + '</span>' : '')
      + '</div>';
  }
  body.innerHTML = html;
  // 事件委托：点击景点项时打开讲解面板
  body.querySelectorAll('.guide-spot-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-index'));
      if (!isNaN(idx) && knownSpots[idx]) {
        openGuidePanel(knownSpots[idx].name);
      }
    });
  });
}

function toggleSidebar(forceClose) {

// 对话管理
async function loadConversations() {
  const r = await fetch('/api/conversations' + _keyQ + (_keyQ ? '&' : '?') + 'uid=' + _uid);
  const d = await r.json();
  convs = d.conversations || [];
  renderConvList();
  if (convs.length === 0) {
    await newConversation();
  } else {
    // 每次登录自动新建对话，旧对话保留在历史列表
    // 判断依据：如果上次访问的对话ID还在列表中，说明是同一会话，直接新建
    // 如果是全新访问（关闭后重新打开），也新建
    const lastVisit = sessionStorage.getItem(_lastVisitKey);
    if (lastVisit) {
      // 同一浏览器会话内，恢复之前的对话
      const lastConv = convs.find(c => c.id === lastVisit);
      if (lastConv) {
        switchConversation(lastConv.id);
      } else {
        await newConversation();
      }
    } else {
      // 新的浏览器会话，自动新建对话
      await newConversation();
    }
  }
}

function renderConvList() {
  convList.innerHTML = '';
  convs.forEach(c => {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
    div.innerHTML = '<span class="title">' + escHtml(c.title) + '</span><button class="del-btn" onclick="event.stopPropagation();deleteConv(\'' + c.id + '\')">×</button>';
    div.onclick = () => switchConversation(c.id);
    convList.appendChild(div);
  });
}

async function newConversation() {
  const r = await fetch('/api/conversations' + _keyQ + (_keyQ ? '&' : '?') + 'uid=' + _uid, { method: 'POST' });
  const conv = await r.json();
  convs.unshift(conv);
  currentConvId = conv.id;
  sessionStorage.setItem(_lastVisitKey, conv.id);
  chatArea.innerHTML = '';
  chatArea.appendChild(createWelcome());
  renderConvList();
  toggleSidebar(false);
  inputBox.focus();
}

async function switchConversation(id) {
  currentConvId = id;
  sessionStorage.setItem(_lastVisitKey, id);
  renderConvList();
  const r = await fetch('/api/conversations/' + id + '/messages' + _keyQ + (_keyQ ? '&' : '?') + 'uid=' + _uid);
  const d = await r.json();
  chatArea.innerHTML = '';
  const msgs = d.messages || [];
  if (msgs.length === 0) {
    chatArea.appendChild(createWelcome());
  } else {
    msgs.forEach(m => addMsg(m.role, m.content, false));
  }
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

async function deleteConv(id) {
  await fetch('/api/conversations/' + id + _keyQ + (_keyQ ? '&' : '?') + 'uid=' + _uid, { method: 'DELETE' });
  convs = convs.filter(c => c.id !== id);
  if (currentConvId === id) {
    if (convs.length > 0) switchConversation(convs[0].id);
    else newConversation();
  }
  renderConvList();
}

function createWelcome() {
  const div = document.createElement('div');
  div.className = 'welcome';
  div.id = 'welcomeArea';
  div.innerHTML = '<h2>你好，我是小景</h2><p>基于大模型+知识图谱的景点智能助手</p><div class="suggestions"><button onclick="showGuideList();document.getElementById(\'guidePanel\').classList.add(\'open\');document.getElementById(\'guideOverlay\').classList.add(\'show\')">景点讲解</button></div>';
  return div;
}

function renderImagesInBubble(bubble, text) {
  // 检测文本中的图片链接行: "图片链接: https://..."
  var imgRegex = /图片链接:\s*(https?:\/\/[^\s\n]+)/g;
  var urls = [];
  var m;
  while ((m = imgRegex.exec(text)) !== null) {
    urls.push(m[1]);
  }
  if (urls.length === 0) return;

  // 从文本中移除图片链接行和页面链接行
  var cleanText = text.replace(/图片链接:\s*https?:\/\/[^\s\n]+/g, '').replace(/页面链接:\s*https?:\/\/[^\s\n]+/g, '').trim();

  // 渲染文本+图片
  bubble.textContent = cleanText;
  var gallery = document.createElement('div');
  gallery.className = 'img-gallery';
  for (var i = 0; i < Math.min(urls.length, 5); i++) {
    var img = document.createElement('img');
    img.className = 'img-thumb';
    // 通过后端代理加载，绕过百度图片防盗链（比referrerPolicy更可靠）
    img.src = '/api/image_proxy?url=' + encodeURIComponent(urls[i]) + _keyA;
    img.alt = '景点图片';
    img.loading = 'lazy';
    img.onerror = function() { this.style.display = 'none'; };
    img.onclick = (function(u) { return function() { openImgOverlay(u); }; })(urls[i]);
    gallery.appendChild(img);
  }
  bubble.appendChild(gallery);
}

// 可信度徽章渲染
function renderCredibilityTag(bubble, text) {
  var tagMatch = text.match(/🟢\s*\[官方确认\][^\n]*/) ||
                 text.match(/🟡\s*\[多方参考\][^\n]*/) ||
                 text.match(/🔴\s*\[存在争议\][^\n]*/) ||
                 text.match(/⚪\s*\[暂无可靠信息\][^\n]*/);
  if (!tagMatch) return;

  var tagText = tagMatch[0];
  var cssClass = 'credibility-gray';
  if (tagText.indexOf('官方确认') >= 0) cssClass = 'credibility-green';
  else if (tagText.indexOf('多方参考') >= 0) cssClass = 'credibility-yellow';
  else if (tagText.indexOf('存在争议') >= 0) cssClass = 'credibility-red';

  // 从气泡文本中移除标签行
  var cleanText = text.replace(/🟢\s*\[官方确认\][^\n]*/, '')
                       .replace(/🟡\s*\[多方参考\][^\n]*/, '')
                       .replace(/🔴\s*\[存在争议\][^\n]*/, '')
                       .replace(/⚪\s*\[暂无可靠信息\][^\n]*/, '')
                       .replace(/\n{2,}$/, '\n').trim();
  bubble.textContent = cleanText;

  // 添加徽章
  var badge = document.createElement('span');
  badge.className = 'credibility-tag ' + cssClass;
  badge.textContent = tagText.replace(/^\S+\s*/, '');
  bubble.appendChild(badge);

  // 如果有图片链接，重新渲染图片
  if (/图片链接:/.test(cleanText)) {
    renderImagesInBubble(bubble, cleanText);
  }
}

// 消息
function addMsg(role, text, scroll) {
  if (scroll === undefined) scroll = true;
  const w = chatArea.querySelector('.welcome');
  if (w) w.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? '你' : '景';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(av);
  div.appendChild(bubble);
  // 为assistant历史消息渲染图片
  if (role === 'assistant' && text && /图片链接:/.test(text)) {
    renderImagesInBubble(bubble, text);
  }
  // 为assistant消息渲染可信度徽章
  if (role === 'assistant' && text) {
    renderCredibilityTag(bubble, text);
  }
  // 为assistant消息检测景点名，添加"听讲解"按钮
  if (role === 'assistant' && text) {
    var spots = detectSpots(text);
    if (spots.length > 0) {
      var btnWrap = document.createElement('div');
      btnWrap.style.marginTop = '4px';
      btnWrap.style.paddingLeft = '42px';
      for (var si = 0; si < spots.length; si++) {
        var btn = document.createElement('button');
        btn.className = 'guide-btn';
        btn.textContent = '听讲解: ' + spots[si].name;
        btn.setAttribute('data-spot', spots[si].name);
        btn.onclick = (function(name) { return function() { openGuidePanel(name); }; })(spots[si].name);
        btnWrap.appendChild(btn);
      }
      div.appendChild(btnWrap);
    }
  }
  chatArea.appendChild(div);
  if (scroll) chatArea.scrollTop = chatArea.scrollHeight;
  return bubble;
}

function ask(q) { inputBox.value = q; send(); }

function stopGeneration() {
  if (currentAbortCtrl) {
    currentAbortCtrl.abort();
    currentAbortCtrl = null;
  }
  document.getElementById('stopBtn').classList.remove('show');
  sendBtn.disabled = false;
}

async function send() {
  const q = inputBox.value.trim();
  if (!q || sendBtn.disabled) return;
  inputBox.value = '';
  sendBtn.disabled = true;

  if (!currentConvId) {
    const r = await fetch('/api/conversations' + _keyQ + (_keyQ ? '&' : '?') + 'uid=' + _uid, { method: 'POST' });
    const conv = await r.json();
    currentConvId = conv.id;
    convs.unshift(conv);
  }

  addMsg('user', q);

  var conv = convs.find(function(c) { return c.id === currentConvId; });
  if (conv && conv.title === '新对话') {
    var newTitle = q.substring(0, 20) + (q.length > 20 ? '...' : '');
    conv.title = newTitle;
    renderConvList();
    fetch('/api/conversations/' + currentConvId + _keyQ + (_keyQ ? '&' : '?') + 'uid=' + _uid, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title: newTitle}) });
  }

  var bubble = addMsg('assistant', '');
  bubble.classList.add('typing');
  bubble.innerHTML = '<span style="color:#999">思考中...</span>';

  var fullText = '';
  var answerStarted = false;
  try {
    currentAbortCtrl = new AbortController();
    var timeout = setTimeout(function() { if (currentAbortCtrl) currentAbortCtrl.abort(); }, 120000);
    document.getElementById('stopBtn').classList.add('show');
    var resp = await fetch('/chat/stream' + _keyQ, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, conversation_id: currentConvId }),
      signal: currentAbortCtrl.signal
    });
    clearTimeout(timeout);

    if (!resp.ok) {
      bubble.classList.remove('typing');
      bubble.textContent = '请求失败：HTTP ' + resp.status;
      sendBtn.disabled = false;
      return;
    }

    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    while (true) {
      var result = await reader.read();
      if (result.done) break;
      buffer += decoder.decode(result.value, { stream: true });

      var lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf('[进度]') === 0) {
          bubble.innerHTML = '<span style="color:#999">' + escHtml(line) + '</span>';
          chatArea.scrollTop = chatArea.scrollHeight;
        } else {
          if (!answerStarted) {
            answerStarted = true;
            bubble.classList.remove('typing');
            bubble.textContent = '';
          }
          fullText += line + '\n';
          bubble.textContent = fullText.trimEnd();
          chatArea.scrollTop = chatArea.scrollHeight;
        }
      }
    }
    if (buffer) {
      if (buffer.indexOf('[进度]') === 0) {
        bubble.innerHTML = '<span style="color:#999">' + escHtml(buffer) + '</span>';
      } else {
        if (!answerStarted) {
          answerStarted = true;
          bubble.classList.remove('typing');
          bubble.textContent = '';
        }
        fullText += buffer;
        bubble.textContent = fullText.trimEnd();
      }
    }
    if (!answerStarted) {
      bubble.classList.remove('typing');
      bubble.textContent = fullText || '未获取到回答';
    }
    // 流式回答完成后，渲染图片
    if (fullText && /图片链接:/.test(fullText)) {
      renderImagesInBubble(bubble, fullText);
    }
    // 流式回答完成后，渲染可信度徽章
    if (fullText) {
      renderCredibilityTag(bubble, fullText);
    }
    // 流式回答完成后，检测景点并添加讲解按钮
    if (fullText) {
      var spots = detectSpots(fullText);
      if (spots.length > 0) {
        var msgDiv = bubble.parentElement;
        var existing = msgDiv.querySelector('.guide-btn');
        if (!existing) {
          var btnWrap = document.createElement('div');
          btnWrap.style.marginTop = '4px';
          btnWrap.style.paddingLeft = '42px';
          for (var si = 0; si < spots.length; si++) {
            var btn = document.createElement('button');
            btn.className = 'guide-btn';
            btn.textContent = '听讲解: ' + spots[si].name;
            btn.setAttribute('data-spot', spots[si].name);
            btn.onclick = (function(name) { return function() { openGuidePanel(name); }; })(spots[si].name);
            btnWrap.appendChild(btn);
          }
          msgDiv.appendChild(btnWrap);
        }
      }
    }
    // 消息保存已由后端/chat/stream接口统一处理（保证user先于assistant入库，避免顺序错乱）
  } catch (e) {
    bubble.classList.remove('typing');
    if (e.name === 'AbortError') {
      bubble.textContent = fullText || '已停止生成。';
    } else {
      bubble.textContent = '请求出错：' + e.message;
    }
  }
  currentAbortCtrl = null;
  document.getElementById('stopBtn').classList.remove('show');
  sendBtn.disabled = false;
  inputBox.focus();
}

// 初始化
loadConversations();
// 页面关闭时停止语音播放
window.addEventListener('beforeunload', function() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
});
